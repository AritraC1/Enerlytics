[project]
name = "enerlytics"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "django-environ>=0.14.0",
    "gunicorn>=27.0.0",
    "psycopg[binary]>=3.3.8",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]

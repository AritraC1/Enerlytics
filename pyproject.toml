[project]
name = "enerlytics"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "django-environ>=0.14.0",
    "gunicorn>=27.0.0",
    "joblib>=1.6.0",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.8",
    "scikit-learn>=1.9.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
# Django apps keep their tests in each app's tests.py, which doesn't match
# pytest's default test_*.py pattern — include it so `uv run pytest` finds them.
python_files = ["test_*.py", "tests.py"]
DJANGO_SETTINGS_MODULE = "config.settings"
